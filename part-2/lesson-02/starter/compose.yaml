# Local PostgreSQL for development: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: taskdb
    ports:
      - "127.0.0.1:5432:5432" # this computer only, like our API
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d taskdb"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
