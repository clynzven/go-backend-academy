name: ci
on: [push, pull_request]

jobs:
  complete:
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [code/lesson-01/complete, code/lesson-02/complete, code/lesson-03/complete,
              code/lesson-04/complete, code/lesson-05/complete, code/lesson-06/complete,
              code/lesson-07/complete, code/lesson-08/complete, code/go-backend-academy-complete,
              part-2/lesson-01/complete, part-2/lesson-02/complete, part-2/lesson-03/complete,
              part-2/lesson-04/complete, part-2/lesson-05/complete, part-2/lesson-06/complete,
              part-2/lesson-07/complete, part-2/lesson-08/complete, part-2/go-backend-academy-hardened]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: taskdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d taskdb_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://app:app@127.0.0.1:5432/taskdb_test?sslmode=disable
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.dir }}/go.mod
          cache-dependency-path: ${{ matrix.dir }}/go.*
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  starters:
    # Starters have TODOs (Part 2: vulnerabilities) and failing tests on purpose: they must compile, not pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: code/lesson-08/starter/go.mod
      - run: |
          for d in code/lesson-0*/starter part-2/lesson-*/starter; do
            echo "== $d"
            (cd "$d" && go vet ./... && go test -count=1 -run '^$' ./...) || exit 1
          done
